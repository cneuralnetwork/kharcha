services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kharcha
      POSTGRES_PASSWORD: kharcha
      POSTGRES_DB: kharcha
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kharcha-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharcha -d kharcha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kharcha-postgres:
