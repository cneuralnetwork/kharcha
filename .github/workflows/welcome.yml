name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! Please check [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for guidelines, and feel free to ask questions.
          pr-message: |
            Thanks for your first pull request! A maintainer will review it shortly. Please make sure all CI checks pass and you have filled in the PR template completely.
